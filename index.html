
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Wash - Servicio Técnico</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;margin:0;padding:16px;color:#172033}
main{max-width:650px;margin:auto}
h1{background:#12345a;color:white;padding:20px;border-radius:12px;font-size:25px}
form,.panel{background:white;padding:18px;border-radius:12px;margin:15px 0}
label{display:block;font-weight:bold;margin-top:14px}
input,select,textarea{width:100%;box-sizing:border-box;padding:13px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{width:100%;padding:15px;background:#087443;color:white;border:0;border-radius:9px;font-size:17px;margin-top:18px}
.secondary{background:#12345a}
#estado{font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<main>
<h1>Car Wash<br>Servicio Técnico</h1>
<div class="panel">
<h2>Nueva intervención</h2>
<form id="formulario">
<label>Fecha</label>
<input id="fecha" type="date" required>
<label>Cliente</label>
<input id="cliente" required>
<label>Técnico</label>
<input id="tecnico" required>
<label>Tiempo de trabajo (horas)</label>
<input id="trabajo" type="number" min="0" step="0.25" required>
<label>Tiempo de desplazamiento (horas)</label>
<input id="desplazamiento" type="number" min="0" step="0.25" required>
<label>Tipo de avería</label>
<input id="averia" required>
<label>Solución aplicada</label>
<textarea id="solucion" rows="3" required></textarea>
<label>Materiales utilizados</label>
<textarea id="materiales" rows="2"></textarea>
<label>¿Solucionada en la primera visita?</label>
<select id="primera" required>
<option value="true">Sí</option>
<option value="false">No</option>
</select>
<button type="submit">Guardar intervención</button>
</form>
<p id="estado"></p>
</div>
<div class="panel">
<h2>Últimas intervenciones</h2>
<button class="secondary" id="recargar" type="button">Consultar intervenciones</button>
<div id="lista"></div>
</div>
</main>
<script>
const SUPABASE_URL = "https://kcyfukwyqfgiuavulhuf.supabase.co";
const SUPABASE_KEY = "sb_publishable_E_SgYg8Cobiv9cQoylfvMQ_aI5BiT_8";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("fecha").value =
  new Date().toLocaleDateString("en-CA");

const estado = document.getElementById("estado");

document.getElementById("formulario").addEventListener("submit", async e => {
  e.preventDefault();
  estado.textContent = "Guardando...";
  const fila = {
    fecha_intervencion: document.getElementById("fecha").value,
    cliente: document.getElementById("cliente").value.trim(),
    tecnico: document.getElementById("tecnico").value.trim(),
    tiempo_trabajo: Number(document.getElementById("trabajo").value),
    tiempo_desplazamiento: Number(document.getElementById("desplazamiento").value),
    tipo_averia: document.getElementById("averia").value.trim(),
    solucion: document.getElementById("solucion").value.trim(),
    materiales: document.getElementById("materiales").value.trim(),
    primera_visita: document.getElementById("primera").value === "true"
  };
  const { error } = await db.from("intervenciones").insert([fila]);
  if (error) {
    estado.textContent = "Error al guardar: " + error.message;
    return;
  }
  estado.textContent = "Intervención guardada correctamente.";
  document.getElementById("formulario").reset();
  document.getElementById("fecha").value =
    new Date().toLocaleDateString("en-CA");
  cargar();
});

async function cargar() {
  const lista = document.getElementById("lista");
  lista.textContent = "Cargando...";
  const { data, error } = await db.from("intervenciones")
    .select("*").order("fecha_intervencion", {ascending:false}).limit(20);
  if (error) {
    lista.textContent = "No se pudieron consultar los datos: " + error.message;
    return;
  }
  lista.replaceChildren();
  if (!data.length) {
    lista.textContent = "Todavía no hay intervenciones.";
    return;
  }
  data.forEach(r => {
    const item = document.createElement("div");
    item.style.cssText = "padding:12px 0;border-bottom:1px solid #ddd";
    const titulo = document.createElement("strong");
    titulo.textContent = (r.fecha_intervencion || "") + " — " + (r.cliente || "");
    const detalle = document.createElement("p");
    detalle.textContent = "Técnico: " + (r.tecnico || "") +
      " · Trabajo: " + r.tiempo_trabajo + " h" +
      " · Desplazamiento: " + r.tiempo_desplazamiento + " h";
    item.append(titulo, detalle);
    lista.append(item);
  });
}
document.getElementById("recargar").addEventListener("click", cargar);
</script>

<section id="estadisticas" style="padding:20px;max-width:1000px;margin:auto;font-family:Arial,sans-serif">
  <h2>Estadísticas del servicio técnico</h2>
  <p>Resumen de intervenciones registradas</p>

  <button onclick="cargarEstadisticas()" style="padding:12px 18px;font-size:16px">
    Actualizar estadísticas
  </button>

  <p id="estadoEstadisticas">Pulsa actualizar para consultar los datos.</p>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
    <div style="padding:18px;border:1px solid #ccc;border-radius:10px">
      <h3>Intervenciones</h3>
      <strong id="totalIntervenciones">—</strong>
    </div>
    <div style="padding:18px;border:1px solid #ccc;border-radius:10px">
      <h3>Horas de trabajo</h3>
      <strong id="totalTrabajo">—</strong>
    </div>
    <div style="padding:18px;border:1px solid #ccc;border-radius:10px">
      <h3>Horas de desplazamiento</h3>
      <strong id="totalDesplazamiento">—</strong>
    </div>
  </div>

  <h3>Intervenciones por técnico</h3>
  <div id="estadisticasTecnicos"></div>
</section>

<script>
</body>  
async function cargarEstadisticas() {
  const estado = document.getElementById("estadoEstadisticas");
  estado.textContent = "Consultando datos...";

  try {
    const { data, error } = await db
      .from("intervenciones")
      .select("*");

    if (error) throw error;

    const filas = data || [];

    document.getElementById("totalIntervenciones").textContent =
      filas.length;

    const trabajo = filas.reduce(
      (s, r) => s + (Number(r.tiempo_trabajo) || 0), 0
    );

    const desplazamiento = filas.reduce(
      (s, r) => s + (Number(r.tiempo_desplazamiento) || 0), 0
    );

    document.getElementById("totalTrabajo").textContent =
      trabajo.toFixed(2);

    document.getElementById("totalDesplazamiento").textContent =
      desplazamiento.toFixed(2);

    const tecnicos = {};

    filas.forEach(r => {
      const nombre = r.tecnico || "Sin indicar";
      tecnicos[nombre] = (tecnicos[nombre] || 0) + 1;
    });

    const lista = document.getElementById("estadisticasTecnicos");
    lista.replaceChildren();

    Object.entries(tecnicos)
      .sort((a, b) => b[1] - a[1])
      .forEach(([nombre, total]) => {
        const p = document.createElement("p");
        p.textContent = nombre + ": " + total + " intervenciones";
        lista.appendChild(p);
      });

    estado.textContent = "Estadísticas actualizadas correctamente.";
  } catch (e) {
    estado.textContent = "Error al consultar: " + e.message;
  }
}
</script>
</html>
